name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:  # lets you also trigger it manually from the GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android

      - name: Tune Gradle memory (replaces default jvmargs cleanly)
        run: |
          sed -i '/org.gradle.jvmargs/d' android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1536m" >> android/gradle.properties
          echo "org.gradle.workers.max=1" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "--- Final gradle.properties: ---"
          cat android/gradle.properties

      - name: Force-disable lintVital tasks project-wide
        run: |
          cat >> android/build.gradle << 'INNEREOF'

          allprojects {
              tasks.whenTaskAdded { task ->
                  if (task.name.contains("lintVital")) {
                      task.enabled = false
                  }
              }
          }
          INNEREOF

      - name: Build APK locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --local --output ./campuswatch.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: campuswatch-apk
          path: campuswatch.apk